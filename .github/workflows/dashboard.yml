name: Update GitHub Analytics Dashboard

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:        # allow manual "Run workflow" trigger
  push:
    branches:
      - main
    paths:
      - "scripts/generate-dashboard.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate dashboard.svg from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Rohit038
        run: node scripts/generate-dashboard.mjs

      - name: Commit updated dashboard + history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.svg data/history.json
          git diff --cached --quiet || git commit -m "chore: refresh live analytics dashboard"
          git push
